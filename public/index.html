<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Code Mate</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- [需求@2026-06-10 §1.5] Markdown 渲染依赖 (CDN, no build chain) -->
  <link rel="stylesheet" id="hljs-theme-link" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">Claude Code Mate <span class="phase">Phase 2C</span></div>
    <div class="project-switcher">
      <label>Project:</label>
      <select id="project-picker"></select>
      <button id="add-project-btn" title="Add or import a project">+</button>
    </div>
    <div class="banners" id="banners"></div>
    <div class="actions">
      <!-- [需求@2026-06-10 §1.1] 环境检测 -->
      <button id="healthcheck-btn" title="环境检测(手动触发,失败不阻塞)">环境检测</button>
      <!-- [需求@2026-06-11 §2 + 2026-06-12 §8.6] 仪表盘按钮(原"终端"升级成"系统")-->
      <button id="terminals-btn" title="Mate 系统仪表盘:终端实时 / 任务队列 / H 派工时序 / 对话控制">系统 <span id="terminals-count">0</span></button>
      <!-- [需求@2026-06-10 §1.3] 亮/暗主题切换 -->
      <button id="theme-btn" title="切换亮/暗主题">🌙</button>
      <button id="new-thread-btn">+ 新线索</button>
    </div>
  </header>

  <!-- [需求@2026-06-11 §3] 顶栏下方动态事件流 — spawn/kill/handoff/done/blocked 实时流 -->
  <div id="event-ticker" aria-label="终端事件流">
    <span class="ticker-label">EVENTS</span>
    <div id="ticker-events"></div>
  </div>

  <dialog id="add-project-dialog">
    <form id="add-project-form" method="dialog">
      <h3>添加 / 导入项目</h3>
      <label>名字 <input id="ap-name" required placeholder="kb_backend" /></label>
      <label>根目录 <input id="ap-root" required placeholder="D:\dev\kb_backend" /></label>
      <div id="ap-inspect" class="muted"></div>
      <div class="dialog-actions">
        <button type="button" id="ap-cancel">取消</button>
        <button type="submit" id="ap-submit">添加</button>
      </div>
      <div id="ap-error" class="error"></div>
    </form>
  </dialog>

  <!-- [需求@2026-06-10 §1.4] 新线索 dialog:slug 砍掉,只剩可选 title -->
  <dialog id="new-thread-dialog">
    <form id="new-thread-form" method="dialog">
      <h3>新建线索</h3>
      <label>标题(可选)
        <input id="nt-title" placeholder="留空 → 首轮对话后系统自动摘要" />
      </label>
      <div class="muted">系统自动生成内部 ID,你只看 title。</div>
      <div class="dialog-actions">
        <button type="button" id="nt-cancel">取消</button>
        <button type="submit" id="nt-submit">创建</button>
      </div>
      <div id="nt-error" class="error"></div>
    </form>
  </dialog>

  <!-- [需求@2026-06-10 §1.1] 环境检测结果 dialog -->
  <dialog id="healthcheck-dialog">
    <form method="dialog">
      <h3>环境检测</h3>
      <div id="hc-results">点击下方"开始检测"...</div>
      <div class="dialog-actions">
        <button type="button" id="hc-run">开始检测</button>
        <button type="submit">关闭</button>
      </div>
    </form>
  </dialog>

  <!-- [需求@2026-06-12 §8.6-8.9] Mate 系统仪表盘 — 4 个 tab -->
  <dialog id="terminals-dialog">
    <form method="dialog">
      <h3>Mate 系统</h3>
      <div class="dashboard-tabs" id="dashboard-tabs">
        <button type="button" class="tab-btn active" data-tab="terminals">终端实时</button>
        <button type="button" class="tab-btn" data-tab="queue">任务队列</button>
        <button type="button" class="tab-btn" data-tab="dispatch">H 派工时序</button>
        <button type="button" class="tab-btn" data-tab="control">对话控制</button>
      </div>

      <div class="tab-content" data-tab="terminals">
        <div class="terminals-toolbar">
          <label><input type="checkbox" id="term-include-dead" /> 显示已死亡(dead)</label>
          <button type="button" id="term-refresh">刷新</button>
        </div>
        <div id="terminals-list"></div>
      </div>

      <div class="tab-content" data-tab="queue" hidden>
        <div class="tab-placeholder">任务队列视图 — Phase 2D §8.7 实现</div>
      </div>
      <div class="tab-content" data-tab="dispatch" hidden>
        <div class="tab-placeholder">H 派工时序视图 — Phase 2D §8.8 实现</div>
      </div>
      <div class="tab-content" data-tab="control" hidden>
        <div class="tab-placeholder">对话控制(NL 跟 mateBot 聊)— Phase 2D §8.9 实现</div>
      </div>

      <div class="dialog-actions">
        <button type="submit">关闭</button>
      </div>
    </form>
  </dialog>

  <main>
    <aside id="thread-board">
      <h2>线索 (Threads)</h2>
      <ul id="threads"></ul>
      <div id="thread-empty" class="empty-state" hidden>
        还没有线索。点击 <strong>+ 新线索</strong> 开始第一条。
      </div>
    </aside>

    <section id="conversation">
      <header id="conv-header">
        <span id="conv-title">选一条线索开始</span>
        <select id="stage-picker" hidden>
          <option value="discussing">discussing</option>
          <option value="designing">designing</option>
          <option value="executing">executing</option>
          <option value="testing">testing</option>
          <option value="verified">verified</option>
          <option value="closed">closed</option>
        </select>
      </header>
      <div id="stream"></div>
      <form id="send-form">
        <textarea id="msg-input" placeholder="输入消息发送...(Ctrl+Enter 发送)" rows="3"></textarea>
        <button type="submit" id="send-btn">发送</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
